site_name: EdgeCDN-X
site_url: https://edgecdn-x.github.io
theme:
  name: material
  features:
    - content.tabs.link
plugins:
  - tags
markdown_extensions:
  - attr_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - "Overview": index.md
  - "Getting Started": getting-started.md
  - "Standalone DNS Deployment": standalone-dns-deployment.md
  - "User Guide":
    - "Defining Projects": user-guide/defining-projects.md
    - "Defining Zones and Records": user-guide/defining-zones-and-records.md
    - "Defining Locations": user-guide/defining-locations.md

  - "Tags": tags.md
  - "Contact": contact.md